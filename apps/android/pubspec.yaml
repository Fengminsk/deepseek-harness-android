name: dsh_android
description: "Pocket Harness — 手机上的本地 Agent 与可选原版 Web。"
publish_to: 'none'
version: 0.1.0+120
environment:
  sdk: ^3.13.5
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: 1.7.0
  material_color_utilities: ^0.13.0
  dynamic_color: ^2.1.0
  qr_flutter: ^4.1.0
  flutter_markdown_plus: 1.0.12
  markdown: 7.3.1
  flutter_svg: 2.3.0
  # CA 指纹 TOFU：配对时要用 SHA-256 比对 /ca.cer 与配对码里的 instance，
  # Dart 标准库没有摘要算法。用 dart-lang 官方包，不自己实现 DER/哈希。
  crypto: ^3.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  shaders:
    - shaders/liquid_glass.frag
  assets:
    - assets/icons/dsh/
    - licenses/FlClash-GPL-3.0.txt
    - licenses/flclash-source.json
    - licenses/require-builtin-MIT.txt
    - licenses/node-addon-api-MIT.txt
