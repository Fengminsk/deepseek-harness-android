name: dsh_android
description: "Pocket Harness — 手机上的本地 Agent 与可选原版 Web。"
publish_to: 'none'
version: 0.1.0+22
environment:
  sdk: ^3.13.5
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: 1.7.0
  material_color_utilities: ^0.13.0
  dynamic_color: ^2.1.0
  qr_flutter: ^4.1.0
  flutter_markdown_plus: 1.0.12
  flutter_svg: 2.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  shaders:
    - shaders/liquid_glass.frag
  assets:
    - licenses/FlClash-GPL-3.0.txt
    - licenses/flclash-source.json
    - licenses/require-builtin-MIT.txt
    - licenses/node-addon-api-MIT.txt
