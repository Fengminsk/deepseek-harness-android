# The App owns the listener lifecycle; the original Web frontend roster stays intact.
- id: web-startup
  disabled: true
- id: webserver
  disabled: true
- id: web-runtime
  disabled: true
- id: harness-dev-context
  disabled: true
- id: client-hmr
  disabled: true
# App and Web share the original lazy index in the private DSH home.
- id: session-query-sqlite
  config:
    path: !!js dshHomePath('session-search.sqlite')
    openAt: first-search
# Android confines the application UID, not individual shell commands.
- id: permission
  disabled: true
- id: ui-permission
  disabled: true
- id: connection
  inject: []
  config:
    trustedHosts: []
- id: credentials
  disabled: true
- id: attachment-local
  disabled: true
- id: subprocess
  disabled: false
- id: bash-sandbox
  disabled: true
- id: pwsh-sandbox
  disabled: true
- id: terminal-controller
  disabled: true
- id: open-in-app
  disabled: true
- id: ui-open-in-app
  disabled: true
- id: office-kit
  name: '@deepseek-ai/dsh-office-kit'
  config:
    # A separate Node process releases LibreOffice WASM memory after each render.
    # It does not lower conversion peak RSS or guarantee survival under the OS LMK.
    subprocessConversions: true
    outputDirectory: !!js dshHomePath('office-kit', 'outputs')
    maxConcurrentConversions: 1
    maxQueuedJobs: 2
    maxReaders: 4
    maxSourceBytes: 10485760
    maxBackgroundConversions: 0
    maxCachedEntries: 2
    maxCachedBytes: 33554432
    maxSourceEntries: 8
    timeoutMs: 90000
    maxInputBytes: 10485760
    maxOutputBytes: 20971520
    maxImageResolution: 96
    maxArchiveEntries: 2000
    maxUncompressedBytes: 67108864
    maxFontFiles: 1024
    maxFontFileBytes: 16777216
    maxLoadedFontBytes: 67108864
# Android previews Office through the kit directly; the authoring skill and its tools stay out of the preset.
- id: skill-office
  disabled: true
- id: directory-picker
  disabled: true
- id: sandbox-policy
  config:
    # Original file tools enforce this policy. Android Shell still runs with
    # the App UID after approval; it does not gain a kernel sandbox here.
    mode: workspace-write
    workspaceRoot: !!js process.cwd()
- id: approval
  config:
    policy: ask
- id: fs-sandbox
  disabled: true
- id: ptc-runtime
  disabled: true
- id: workflow-ptc
  disabled: true
- id: tool-workflow
  disabled: true
- id: session-persistence-jsonl
  disabled: true
- id: agent-preset-registry
  config:
    default: android
- id: preset-standard
  disabled: true
- id: preset-minimal
  disabled: true
- id: preset-ptc
  disabled: true
- id: preset-cordis
  disabled: true
- insert:
    - id: android-attachment-store
      name: ./android-attachment-store.mjs
    - id: android-session-persistence
      name: ./android-session-persistence.mjs
      config:
        root: !!js dshHomePath('sessions')
        compression: none
    - id: android-filesystem
      name: ./android-filesystem.mjs
    - id: android-directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: android-runtime
      name: '@minnnng/dsh-android-runtime'
    # Default off. The App Settings page writes `enabled` through the settings
    # service; standard tool approvals then ask this model reviewer first. The
    # package subpath is stable across runtime generations, unlike the resolved
    # file URL a relative entry name becomes in the persisted profile patch.
    - id: android-auto-review
      name: '@minnnng/dsh-android-runtime/auto-review.mjs'
    - id: preset-android
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: android
        name: Android 本地 Agent
        description: 在应用权限范围内处理文件、执行 Shell 和后台任务。
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are Pocket Harness running locally inside an Android app. Use android_attachments for uploaded files in this conversation; list first, then read text or binary pages, inspect ZIP/APK metadata, or materialize a verified copy into the workspace. Archive metadata and a matching download hash do not prove an APK is unpacked or free of hardening. Use android_files for user-authorized documents, including read_image for supported images; first call roots and use its exact opaque id, never the display name. A root directory path is the empty string. The ordinary read, read_image, edit, glob, grep and present tools accept paths only inside the App workspace; relative paths resolve from the Session working directory, and glob or grep may omit the path to search there. The string-replace editor requires an absolute file path and cannot view a directory. General shell is unavailable unless an android_shell tool is explicitly offered; any such command needs its own approval. Root and adb are unavailable. Never interpret a content URI as a filesystem path.
          # stage-preset.mjs appends original goal, planning, compaction, schedule,
          # and local subagent tools with their policy and isolation; no PTC workflows.
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: true
              write: true
              edit: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
            config:
              mode: timed
