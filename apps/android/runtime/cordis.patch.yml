# The App owns the listener lifecycle; the original Web frontend roster stays intact.
- id: web-startup
  disabled: true
- id: webserver
  disabled: true
- id: web-runtime
  disabled: true
- id: harness-dev-context
  disabled: true
- id: client-hmr
  disabled: true
# Android confines the application UID, not individual shell commands.
- id: permission
  disabled: true
- id: ui-permission
  disabled: true
- id: connection
  inject: []
  config:
    trustedHosts: []
- id: credentials
  disabled: true
- id: attachment-local
  disabled: true
- id: subprocess
  disabled: false
- id: bash-sandbox
  disabled: true
- id: pwsh-sandbox
  disabled: true
- id: terminal-controller
  disabled: true
- id: open-in-app
  disabled: true
- id: ui-open-in-app
  disabled: true
- id: office-to-pdf
  disabled: true
- id: directory-picker
  disabled: true
- id: sandbox-policy
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()
- id: approval
  config:
    policy: ask
- id: fs-sandbox
  disabled: true
- id: ptc-runtime
  disabled: true
- id: session-persistence-jsonl
  disabled: true
- id: agent-preset-registry
  config:
    default: android
- id: preset-standard
  disabled: true
- id: preset-minimal
  disabled: true
- id: preset-ptc
  disabled: true
- id: preset-cordis
  disabled: true
- insert:
    - id: android-attachment-store
      name: ./android-attachment-store.mjs
    - id: android-session-persistence
      name: ./android-session-persistence.mjs
      config:
        root: !!js dshHomePath('sessions')
        compression: none
    - id: android-filesystem
      name: '@deepseek-ai/dsh-fs-local'
    - id: android-directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: android-runtime
      name: '@minnnng/dsh-android-runtime'
    - id: preset-android
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: android
        name: Android 本地 Agent
        description: 在应用权限范围内处理文件、执行 Shell 和后台任务。
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are Pocket Harness running locally inside an Android app. Use android_shell for ordinary app-UID shell commands and android_files for user-authorized documents. Root and adb are unavailable. Never interpret a content URI as a filesystem path.
          # stage-preset.mjs appends original goal, planning, compaction, schedule,
          # and local subagent tools with their policy and isolation; no PTC workflows.
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: true
              write: false
              edit: false
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
            config:
              mode: timed
